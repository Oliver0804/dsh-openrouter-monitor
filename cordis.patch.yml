# dsh-openrouter-monitor bundle patch: inserts its plugin row into the profile
# roster. Install with `dsh plugin --profile web add <package-or-path>`.
#
# The host entry registers the settings namespace (the thing that makes the
# monitor configurable from the web settings surface); the browser row is
# mounted through the `dsh.client` declaration in package.json.
- insert:
    - id: openrouter-monitor
      name: 'dsh-openrouter-monitor'
